# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/MIDIvJoy"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # System.Drawing.Common 11.0.0 only ships real implementations for
      # net10.0/net11.0. This project targets net8.0-windows, so 11.0.0 resolves
      # to the netstandard2.0 stub, which throws PlatformNotSupportedException
      # (Icon.ExtractAssociatedIcon, SystemIcons.Application for the tray icon).
      # Remove this ignore when the project moves to net10.0-windows or later.
      - dependency-name: "System.Drawing.Common"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
